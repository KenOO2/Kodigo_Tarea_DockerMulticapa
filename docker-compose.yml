# =============================================================================
# Ecosistema e-commerce: Next.js + Laravel (PHP-FPM + Nginx) + MySQL
#
#   cp .env.example .env     # y completa los valores
#   docker compose up -d --build
#
# Redes:
#   app_net -> frontend <-> nginx <-> backend
#   db_net  -> backend <-> db   (el frontend NO puede alcanzar la base de datos)
# =============================================================================
name: ecommerce

services:
  # ---------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
      args:
        # Se "queman" en el bundle durante `next build` (son públicas).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    image: ecommerce-frontend:latest
    restart: unless-stopped
    environment:
      # El servidor de Next llama a la API por la red interna (no por localhost).
      API_INTERNAL_URL: http://nginx/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - nginx
    networks:
      - app_net

  # ------------------------------------------------- Backend: Nginx (proxy)
  nginx:
    build:
      context: ./backend
      target: nginx
    image: ecommerce-nginx:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - backend
    networks:
      - app_net

  # ------------------------------------------------- Backend: Laravel PHP-FPM
  backend:
    build:
      context: ./backend
      target: backend
    image: ecommerce-backend:latest
    restart: unless-stopped
    # Solo se pasan las variables que Laravel necesita (no se filtra, por
    # ejemplo, MYSQL_ROOT_PASSWORD a este contenedor).
    environment:
      APP_NAME: ${APP_NAME:-Ecommerce API}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr          # los logs salen por `docker compose logs`
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:?Falta MYSQL_DATABASE, copia .env.example a .env}
      DB_USERNAME: ${MYSQL_USER:?Falta MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
      DB_SEED: ${DB_SEED:-true}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-60}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-20160}
      STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      L5_SWAGGER_GENERATE_ALWAYS: "false"   # ya se genera al arrancar
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
      - db_net

  # ---------------------------------------------------------------- MySQL
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Falta MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Scripts .sql/.sh opcionales: se ejecutan UNA vez, al crear el volumen vacío.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # SIN `ports:` -> 3306 solo es accesible dentro de la red interna.
    expose:
      - "3306"
    healthcheck:
      # -h 127.0.0.1 (TCP) y no "localhost" (socket): durante la inicialización
      # MySQL levanta un servidor temporal sin red; con socket el healthcheck
      # daría "healthy" demasiado pronto.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - db_net

  # ------------------------------------- phpMyAdmin (OPCIONAL, solo desarrollo)
  # No arranca por defecto. Actívalo con:  docker compose --profile tools up -d
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"   # solo accesible desde tu propia máquina
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_net

networks:
  app_net:
  db_net:

volumes:
  db_data:
