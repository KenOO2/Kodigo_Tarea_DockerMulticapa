expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
date.timezone = America/El_Salvador

[opcache]
opcache.enable = 1
; El código no cambia dentro de un contenedor en producción: no hace falta
; comprobar timestamps en cada petición.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
